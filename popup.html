<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RSS Feed Finder</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div id="container">
    <h2>RSS Feeds</h2>
    <div id="options">
      <label class="checkbox-container">
        <input type="checkbox" id="deep-search">
        <span class="checkmark"></span>
        Deep search (scan sitemaps)
      </label>
      <button id="search-button">Search for Feeds</button>
    </div>
    
    <div id="log-container">
      <div id="log-messages"></div>
    </div>
    
    <ul id="feeds-list">
      <li class="info-message">Click the Search button to find RSS feeds</li>
    </ul>
  </div>
  <script src="js/main.js" type="module"></script>
</body>
</html>
